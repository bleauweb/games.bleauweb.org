<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pairs</title>
  <meta name="description" content="Turn over two cards; a matching pair stays up. No timer, no lives. Match by shape and colour, by shape only, or by colour only." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script type="module" src="/shared/pwa.js"></script>
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Pairs</h1>
      <p class="tagline">Turn over two cards. A matching pair stays up; anything else turns back when you are ready. No timer and no lives, just the quiet satisfaction of the last pair.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>
  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="chips" style="margin-top:10px">
        <button class="chip" id="btn-auto">Turn back: after a moment</button>
        <button class="chip" id="btn-new">New deal</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
