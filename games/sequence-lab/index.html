<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sequence Lab</title>
  <meta name="description" content="What comes next? Number and shape sequences with clear rules, explained after every answer. No timer, no tricks." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script type="module" src="/shared/pwa.js"></script>
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Sequence <span>Lab</span></h1>
      <p class="tagline">What comes next? Every sequence follows a rule, and the rule is shown after each answer. No timer, no tricks.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>

  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="card">
        <div class="seq" id="seq"></div>
        <div class="muted small" style="text-align:center;margin-top:6px">Which comes next?</div>
      </div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="explain hidden" id="explain"></div>
      <button class="btn wide hidden" id="btn-next">Next</button>
    </div>
  </section>

  <section id="screen-done" class="screen hidden">
    <div class="center card">
      <div class="tick">✓</div>
      <h2 style="justify-content:center" id="done-title"></h2>
      <p class="muted" id="done-text" style="text-align:center"></p>
      <button class="btn wide" id="btn-again">Play this level again</button>
      <button class="btn ghost wide" id="btn-levels">Back to levels</button>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
