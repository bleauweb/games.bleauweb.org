<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tangram Fit</title>
  <meta name="description" content="Fill a silhouette exactly with a fixed set of block pieces. Turn and flip them, tap where they go. Every puzzle fits, by construction." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Tangram <span>Fit</span></h1>
      <p class="tagline">A silhouette and a set of block pieces that fill it exactly. Pick a piece, turn or flip it, then tap the square where it should go. A piece that does not fit simply stays in the tray.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>

  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="chips" style="margin-top:10px">
        <button class="chip" id="btn-rot">↻ Turn</button>
        <button class="chip" id="btn-flip">⇄ Flip</button>
        <button class="chip" id="btn-new">New puzzle</button>
      </div>
      <div class="tray" id="tray"></div>
      <div class="feedback" id="feedback"></div>
      <p class="muted small" style="text-align:center">Tap a placed piece to pick it up again.</p>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
