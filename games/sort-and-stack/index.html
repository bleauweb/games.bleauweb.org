<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sort and Stack</title>
  <meta name="description" content="Sort shapes into bins: by colour, by shape, by two features at once, then by rules you have to work out from examples. The rule is always revealed." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script type="module" src="/shared/pwa.js"></script>
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Sort <span>and</span> Stack</h1>
      <p class="tagline">Tap an item, then tap its bin. The first levels tell you the rule. Later ones only show examples, and you work the rule out. Wrong bins just hand the item back.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>

  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="bins" id="bins"></div>
      <div class="feedback" id="feedback"></div>
      <div class="tray card" id="tray"></div>
      <div class="explain hidden" id="explain"></div>
      <div class="chips" style="margin-top:10px"><button class="chip" id="btn-new">New set</button></div>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
