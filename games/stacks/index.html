<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Stacks</title>
  <meta name="description" content="The Tower of Hanoi, calmly. Move the stack to another peg one disc at a time, never a bigger disc on a smaller one. Hints show the next best move." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script type="module" src="/shared/pwa.js"></script>
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Stacks</h1>
      <p class="tagline">Move the whole stack to another peg, one disc at a time, and never put a bigger disc on a smaller one. Tap a peg to pick up its top disc, tap another to drop it. The same pattern solves every size.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>
  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="pegs" id="pegs"></div>
      <div class="chips" style="margin-top:10px">
        <button class="chip" id="btn-hint">Hint</button>
        <button class="chip" id="btn-undo">Undo</button>
        <button class="chip" id="btn-restart">Restart</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
