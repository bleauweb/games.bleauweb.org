<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Circuit Paths</title>
  <meta name="description" content="Connect matching dots with paths that never cross and fill every square. Calm flow puzzles from 5×5 to 9×9, each guaranteed to have a solution." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Circuit <span>Paths</span></h1>
      <p class="tagline">Join each pair of matching dots with a path. Paths never cross, and when every square is used the circuit is complete. Draw by dragging from a dot; drawing over another path trims it.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>

  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="board-wrap"><svg id="board" class="board"></svg></div>
      <div class="chips" style="margin-top:10px">
        <button class="chip" id="btn-clear">Clear all</button>
        <button class="chip" id="btn-new">New puzzle</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
