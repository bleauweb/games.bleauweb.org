<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Treble Maker</title>
  <meta name="description" content="Learn to read notes on the staff. Treble and bass clef, ledger lines, sharps and flats. Learn, practice, then race the notes." />
  <meta name="theme-color" content="#0f1626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Title / level list -->
  <section id="screen-title" class="screen">
    <div class="card">
      <h1 class="logo">Treble <span>Maker</span></h1>
      <p class="tagline">Read notes on the staff the way you read words: at a glance. Learn, practice, then race them.</p>
      <div class="levels" id="levels"></div>
      <div class="foot">
        <button class="link" id="btn-mute">Sound: on</button>
        <button class="link" id="btn-labels">Key names: on</button>
        <a class="link" href="/">All games</a>
        <button class="link danger" id="btn-reset">Reset progress</button>
      </div>
    </div>
  </section>

  <!-- Play (learn / practice / rush) -->
  <section id="screen-play" class="screen play hidden">
    <div class="topbar">
      <button class="icon-btn" id="btn-close" aria-label="Close">✕</button>
      <div class="top-mid">
        <div class="top-title" id="play-title">Treble lines</div>
        <div class="top-sub" id="play-sub"></div>
      </div>
      <div class="top-right" id="play-right"></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="staff-card">
      <svg id="staff" role="img" aria-label="Music staff"></svg>
    </div>
    <div class="spacer"></div>
    <div class="controls" id="learn-controls">
      <button class="chip" id="btn-clef">Clef: Treble</button>
      <button class="chip" id="btn-staff-labels">Names on staff: on</button>
      <button class="chip" id="btn-random">Show me a note</button>
    </div>
    <div id="piano"></div>
  </section>

  <!-- Results -->
  <section id="screen-results" class="screen hidden">
    <div class="card">
      <h2 id="res-title">Round done</h2>
      <div class="stars big-stars" id="res-stars"></div>
      <p id="res-text"></p>
      <div class="misses" id="res-misses"></div>
      <div class="row">
        <button class="big" id="btn-again">Again</button>
        <button class="big ghost" id="btn-res-menu">Levels</button>
      </div>
      <button class="big gold-btn hidden" id="btn-next-level">Next level</button>
    </div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
