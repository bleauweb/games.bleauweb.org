<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sudoku Calm</title>
  <meta name="description" content="Sudoku without the clock. 4×4, 6×6 and 9×9 grids that can always be finished by singles alone, with notes, gentle conflict marks and a hint that explains itself." />
  <meta name="theme-color" content="#0f1626" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/shared/calm.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script type="module" src="/shared/pwa.js"></script>
</head>
<body>
  <section id="screen-title" class="screen">
    <div class="center">
      <h1 class="logo">Sudoku <span>Calm</span></h1>
      <p class="tagline">Every row, column and box holds each number once. No clock. Every puzzle here can be finished with singles alone: there is always a square with only one possible number, or a number with only one possible square.</p>
      <div class="levels" id="levels"></div>
      <div id="calm"></div>
      <div class="foot"><a class="link" href="/">All games</a><button class="link" id="btn-reset">Reset progress</button></div>
    </div>
  </section>
  <section id="screen-play" class="screen hidden">
    <div class="center">
      <div class="topbar">
        <button class="icon-btn" id="btn-close" aria-label="Back">✕</button>
        <div class="top-mid"><div class="top-title" id="play-title"></div><div class="top-sub" id="play-sub"></div></div>
        <div class="top-right" id="play-right"></div>
      </div>
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="pad" id="pad"></div>
      <div class="chips" style="margin-top:8px">
        <button class="chip" id="btn-notes">Notes: off</button>
        <button class="chip" id="btn-cands">Show options: off</button>
        <button class="chip" id="btn-hint">Hint</button>
        <button class="chip" id="btn-new">New puzzle</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
