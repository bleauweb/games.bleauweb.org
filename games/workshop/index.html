<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Workshop</title>
  <meta name="description" content="Buy wood, ore, leather and cloth; smelt, saw and forge parts into goods at your stations; sell them or deliver orders; upgrade until you can build the Great Clock." />
  <meta name="theme-color" content="#0f1626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <div class="stat coins" id="t-coins"></div>
    <div class="stat level" id="t-level"></div>
    <div class="stat day" id="t-day"></div>
  </header>
  <div class="xpbar"><div id="xpfill"></div></div>
  <main id="view"></main>
  <nav class="tabs">
    <button data-tab="craft" class="on">Craft</button>
    <button data-tab="store">Store</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="shop">Upgrades</button>
  </nav>
  <div id="toasts"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
